[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code_steer_model_write"
version = "0.1.0"
description = "Code steers, models write: a template for reliable agentic AI workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "cedarpy>=4.8",
    "guardrails-ai>=0.11",
    "pydantic-ai-slim[anthropic]>=2.39",
    # openai is NOT pinned here: Guardrails AI pins openai<3 for model calls this runtime never
    # makes, and PydanticAI's OpenAI path needs openai>=3.8; no single resolution exists, so the
    # install is two steps -- this package, then `pip install "openai>=3.8"` (the `openai-api`
    # extra), which pip applies with a warning about Guardrails' pin (decided 2026-09-04).
    "mcp>=2.1",  # L2 gateway (ARCHITECTURE.md 7.10): the official MCP SDK, stdio and in-memory
    "typer>=0.19,<0.28",  # the control-plane verbs; pinned below the release that makes pydantic a hard dependency
    "pydantic-settings>=2.2",
    "jinja2>=3.1",
    "prefect>=3.0",
    "docker>=7.1",  # L5's container tier (ARCHITECTURE.md 7.6): the Docker SDK over Colima or Docker
    "obstore>=0.5",  # L7's artifact bytes (ARCHITECTURE.md 7.7): create-only puts, local now, object storage later
    "jsonschema>=4",  # L10's before_tool_call rail: a tool call's arguments against the ToolSpec's schema
    "mlflow>=2.16",
    "reflex>=0.6",
    "anthropic>=0.40",
    # L6's registered tools ship with the runtime: a fresh install once had a registry whose
    # tools were absent, and the doctor looked on the shell's PATH while the tool ran through the venv
    "pytest>=8",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.optional-dependencies]
openai-api = ["openai>=3.8", "tiktoken>=0.12"]  # PydanticAI's OpenAI path; install as a second step, see above
agent-sdk = ["claude-agent-sdk>=0.1"]
dev = ["pytest-json-report>=1.5", "copier>=9"]

[project.scripts]
csmw = "code_steer_model_write.cli:main"
code_steer_model_write = "code_steer_model_write.cli:main"

[tool.setuptools.packages.find]
include = ["code_steer_model_write*"]

# The template's own lint and format. The pipeline's checks over agent-built code do NOT read
# this file: code_steer_model_write/config.py owns their rule set (rule 4), so a project's own
# ruff config never changes what a run accepts.
[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["examples/", "runs/", "fixtures/", "docs/"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E741", "E731"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
code_steer_model_write = ["data/*.json", "data/*.Dockerfile"]
