<text x="805" y="296.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="600" fill="#4b4b4b">fake backend</text>
<text x="805" y="320.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500" fill="#8a8a8a">the offline walk · zero tokens</text>
<rect x="200" y="392" width="600" height="54" rx="14" fill="#dbe3ee"/>
<text x="500" y="419.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="700" fill="#4b4b4b">ask() · one schema per call · re-ask with the exact problems · never a tool</text>
