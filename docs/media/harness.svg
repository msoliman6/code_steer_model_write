<text x="270" y="518.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="600" fill="#4b4b4b">events.jsonl · the one owner</text>
<text x="270" y="542.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500" fill="#8a8a8a">state.json · artifacts/vNNN.json · gates/ · review/</text>
