<rect x="650" y="24" width="26" height="18" rx="6" fill="#fbe1cc"/>
<text x="686" y="33" dominant-baseline="central" font-size="15" fill="#8a8a8a">Claude</text>
<rect x="650" y="50" width="26" height="18" rx="6" fill="#d4efe8"/>
<text x="686" y="59" dominant-baseline="central" font-size="15" fill="#8a8a8a">Codex</text>
<rect x="650" y="76" width="26" height="18" rx="6" fill="#fbf0c4"/>
<text x="686" y="85" dominant-baseline="central" font-size="15" fill="#8a8a8a">You</text>
<rect x="770" y="24" width="26" height="18" rx="6" fill="#e6e2f5"/>
<text x="806" y="33" dominant-baseline="central" font-size="15" fill="#8a8a8a">Sink</text>
<rect x="770" y="50" width="26" height="18" rx="6" fill="#dbe3ee"/>
<text x="806" y="59" dominant-baseline="central" font-size="15" fill="#8a8a8a">Code — no model</text>
<text x="500" y="876" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8a8a8a">One owner per fact: state.json owns status, events.jsonl owns what happened, the pydantic class owns every shape.</text>
<text x="500" y="900" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8a8a8a">MLflow, Prefect and monitor.db are sinks and views; nothing the driver needs is read back from them.</text>
<text x="500" y="924" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8a8a8a">The fake backend answers every schema offline, so every branch is walked before a token is spent.</text>
</svg>
