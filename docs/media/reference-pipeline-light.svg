<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/></marker>
<marker id="ah-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9a9a9a"/></marker>
</defs>
<rect width="1000" height="1454" rx="22" fill="#ffffff"/>
<rect x="390" y="34" width="220" height="50" rx="14" fill="#e9e9e9"/>
<text x="500" y="59.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Your brief</text>
<rect x="650" y="24" width="26" height="18" rx="6" fill="#fbe1cc"/>
<text x="686" y="33" dominant-baseline="central" font-size="15" fill="#8a8a8a">Claude</text>
<rect x="650" y="50" width="26" height="18" rx="6" fill="#d4efe8"/>
<text x="686" y="59" dominant-baseline="central" font-size="15" fill="#8a8a8a">Codex</text>
<rect x="650" y="76" width="26" height="18" rx="6" fill="#fbf0c4"/>
<text x="686" y="85" dominant-baseline="central" font-size="15" fill="#8a8a8a">You</text>
<rect x="770" y="24" width="26" height="18" rx="6" fill="#e6e2f5"/>
<text x="806" y="33" dominant-baseline="central" font-size="15" fill="#8a8a8a">Both</text>
<rect x="770" y="50" width="26" height="18" rx="6" fill="#dbe3ee"/>
<text x="806" y="59" dominant-baseline="central" font-size="15" fill="#8a8a8a">Code — no model</text>
<line x1="770" y1="85" x2="804" y2="85" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round"/>
<text x="814" y="85" dominant-baseline="central" font-size="15" fill="#8a8a8a">a step</text>
<line x1="770" y1="111" x2="804" y2="111" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/>
<text x="814" y="111" dominant-baseline="central" font-size="15" fill="#8a8a8a">review rounds</text>
<line x1="500" y1="84" x2="500" y2="118" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="60" y="120" width="880" height="118" rx="18" fill="#f2f4f7"/>
<text x="82" y="148" font-size="15" font-weight="600" letter-spacing="1.5" fill="#8a8a8a">0 · PLAN</text>
<rect x="130" y="160" width="280" height="58" rx="14" fill="#fbe1cc"/>
<text x="270" y="189.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Claude writes the plan</text>
<rect x="590" y="160" width="280" height="58" rx="14" fill="#d4efe8"/>
<text x="730" y="189.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Codex attacks it</text>
<line x1="420" y1="189" x2="580" y2="189" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah-rev)" stroke-dasharray="7 6"/>
<text x="500" y="168" text-anchor="middle" dominant-baseline="central" font-size="15" font-style="italic" fill="#8a8a8a">rounds</text>
<line x1="500" y1="238" x2="500" y2="272" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="60" y="274" width="880" height="118" rx="18" fill="#f2f4f7"/>
<text x="82" y="302" font-size="15" font-weight="600" letter-spacing="1.5" fill="#8a8a8a">1 · CONTRACTS</text>
<rect x="130" y="314" width="280" height="58" rx="14" fill="#fbe1cc"/>
<text x="270" y="343.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Claude writes the contract</text>
<rect x="590" y="314" width="280" height="58" rx="14" fill="#d4efe8"/>
<text x="730" y="343.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Codex attacks it</text>
<line x1="420" y1="343" x2="580" y2="343" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah-rev)" stroke-dasharray="7 6"/>
<text x="500" y="322" text-anchor="middle" dominant-baseline="central" font-size="15" font-style="italic" fill="#8a8a8a">rounds + a fresh audit</text>
<line x1="500" y1="392" x2="500" y2="426" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="360" y="428" width="280" height="54" rx="14" fill="#fbf0c4"/>
<text x="500" y="455.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">You confirm the blocks</text>
<line x1="500" y1="482" x2="500" y2="516" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="300" y="518" width="400" height="54" rx="14" fill="#dbe3ee"/>
<text x="500" y="545.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="700" fill="#4b4b4b">Freeze — the contract is hashed</text>
<line x1="500" y1="572" x2="500" y2="606" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="60" y="608" width="880" height="118" rx="18" fill="#f2f4f7"/>
<text x="82" y="636" font-size="15" font-weight="600" letter-spacing="1.5" fill="#8a8a8a">2 · VERIFICATION DESIGN</text>
<rect x="88" y="648" width="258" height="58" rx="14" fill="#d4efe8"/>
<text x="217" y="677.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="600" fill="#4b4b4b">Codex writes the properties</text>
<rect x="371" y="648" width="258" height="58" rx="14" fill="#fbe1cc"/>
<text x="500" y="677.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="600" fill="#4b4b4b">Claude reviews coverage</text>
<rect x="654" y="648" width="258" height="58" rx="14" fill="#d4efe8"/>
<text x="783" y="677.0" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="600" fill="#4b4b4b">Codex arbitrates</text>
<line x1="350" y1="677" x2="367" y2="677" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="633" y1="677" x2="650" y2="677" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="500" y1="726" x2="500" y2="760" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="340" y="762" width="320" height="54" rx="14" fill="#fbf0c4"/>
<text x="500" y="789.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">You confirm the verification</text>
<line x1="500" y1="816" x2="500" y2="850" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="60" y="852" width="880" height="214" rx="18" fill="#f2f4f7"/>
<text x="82" y="880" font-size="15" font-weight="600" letter-spacing="1.5" fill="#8a8a8a">3 · BUILD — TWO ISOLATED WORKTREES</text>
<rect x="100" y="892" width="340" height="72" rx="14" fill="#d4efe8"/>
<text x="270" y="915.6" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Codex writes the tests</text>
<text x="270" y="940.4" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">without the source</text>
<rect x="560" y="892" width="340" height="72" rx="14" fill="#fbe1cc"/>
<text x="730" y="915.6" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Claude writes the source</text>
<text x="730" y="940.4" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">without the tests</text>
<rect x="330" y="1000" width="340" height="54" rx="14" fill="#dbe3ee"/>
<text x="500" y="1027.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">merge · null run · real run</text>
<line x1="270" y1="964" x2="412" y2="996" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="730" y1="964" x2="588" y2="996" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="500" y1="1066" x2="500" y2="1100" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="60" y="1102" width="880" height="130" rx="18" fill="#f2f4f7"/>
<text x="82" y="1130" font-size="15" font-weight="600" letter-spacing="1.5" fill="#8a8a8a">4 · VERIFICATION RUN</text>
<rect x="150" y="1142" width="700" height="72" rx="14" fill="#e6e2f5"/>
<text x="500" y="1165.7" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Each failure is ruled on by the side that did not write it</text>
<text x="500" y="1190.4" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">fix · re-run</text>
<line x1="500" y1="1232" x2="500" y2="1266" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="290" y="1268" width="420" height="50" rx="14" fill="#e9e9e9"/>
<text x="500" y="1293.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#4b4b4b">src · tests · REPORT.md · PAGE.html</text>
<text x="500" y="1332" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8a8a8a">Every model box is a fresh agent — a new, independent context given only the files the toolchain hands it;</text>
<text x="500" y="1356" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8a8a8a">a box's later review rounds are the one thing that continues its own thread.</text>
<text x="500" y="1380" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8a8a8a">Slate boxes and every arrow are code: the driver sequences the run — a workflow enforced by code, not by agents.</text>
<text x="500" y="1404" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8a8a8a">An agent's only power is filling in a JSON schema, enforced at generation by constrained decoding —</text>
<text x="500" y="1428" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8a8a8a">no file reads, no shell, no edits, no tools: the agent answers; code writes every file and decides every step.</text>
</svg>
