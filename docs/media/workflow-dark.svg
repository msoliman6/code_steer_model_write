<text x="500" y="322" text-anchor="middle" dominant-baseline="central" font-size="15" font-style="italic" fill="#9aa4ae">rounds + a fresh audit</text>
<text x="500" y="1332" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8b949e">Every model box is a fresh agent — a new, independent context given only the markdown code rendered for it;</text>
<text x="500" y="1356" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8b949e">every review round is handed the whole trajectory by code — the record is on disk, never in a thread.</text>
<text x="500" y="1380" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8b949e">Slate boxes and every arrow are code: the driver sequences the run — a workflow enforced by code, not by agents.</text>
<text x="500" y="1404" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8b949e">An agent's only power is filling in a JSON schema, enforced at generation by constrained decoding —</text>
<text x="500" y="1428" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8b949e">no file reads, no shell, no edits, no tools: the agent answers; code writes every file and decides every step.</text>
