<rect x="770" y="24" width="26" height="18" rx="6" fill="rgba(163,113,247,0.22)" stroke="rgba(163,113,247,0.75)" stroke-width="1.2"/>
<text x="806" y="33" dominant-baseline="central" font-size="15" fill="#9aa4ae">Sink</text>
<rect x="770" y="50" width="26" height="18" rx="6" fill="rgba(139,148,158,0.22)" stroke="rgba(139,148,158,0.75)" stroke-width="1.2"/>
<text x="806" y="59" dominant-baseline="central" font-size="15" fill="#9aa4ae">Code — no model</text>
<text x="500" y="876" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8b949e">One owner per fact: state.json owns status, events.jsonl owns what happened, the pydantic class owns every shape.</text>
<text x="500" y="900" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8b949e">MLflow, Prefect and monitor.db are sinks and views; nothing the driver needs is read back from them.</text>
<text x="500" y="924" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8b949e">The fake backend answers every schema offline, so every branch is walked before a token is spent.</text>
