<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1114" width="1000" height="1114" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/></marker>
<marker id="ah-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9a9a9a"/></marker>
</defs>
<rect width="1000" height="1114" rx="22" fill="#ffffff"/>
<rect x="650" y="24" width="26" height="18" rx="6" fill="#fbe1cc"/>
<text x="686" y="33" dominant-baseline="central" font-size="15" fill="#8a8a8a">Claude</text>
<rect x="650" y="50" width="26" height="18" rx="6" fill="#d4efe8"/>
<text x="686" y="59" dominant-baseline="central" font-size="15" fill="#8a8a8a">Codex</text>
<rect x="650" y="76" width="26" height="18" rx="6" fill="#fbf0c4"/>
<text x="686" y="85" dominant-baseline="central" font-size="15" fill="#8a8a8a">You</text>
<rect x="770" y="24" width="26" height="18" rx="6" fill="#e6e2f5"/>
<text x="806" y="33" dominant-baseline="central" font-size="15" fill="#8a8a8a">Both</text>
<rect x="770" y="50" width="26" height="18" rx="6" fill="#dbe3ee"/>
<text x="806" y="59" dominant-baseline="central" font-size="15" fill="#8a8a8a">Code — no model</text>
<line x1="770" y1="85" x2="804" y2="85" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round"/>
<text x="814" y="85" dominant-baseline="central" font-size="15" fill="#8a8a8a">a step</text>
<line x1="770" y1="111" x2="804" y2="111" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/>
<text x="814" y="111" dominant-baseline="central" font-size="15" fill="#8a8a8a">review rounds</text>
<rect x="60" y="120" width="880" height="118" rx="18" fill="#f2f4f7"/>
<text x="82" y="148" font-size="15" font-weight="600" letter-spacing="1.5" fill="#8a8a8a">0 · HYPOTHESES</text>
<rect x="60" y="364" width="880" height="118" rx="18" fill="#f2f4f7"/>
<text x="82" y="392" font-size="15" font-weight="600" letter-spacing="1.5" fill="#8a8a8a">1 · CASES</text>
<rect x="60" y="518" width="880" height="118" rx="18" fill="#f2f4f7"/>
<text x="82" y="546" font-size="15" font-weight="600" letter-spacing="1.5" fill="#8a8a8a">2 · REBUTTAL</text>
<rect x="60" y="672" width="880" height="130" rx="18" fill="#f2f4f7"/>
<text x="82" y="700" font-size="15" font-weight="600" letter-spacing="1.5" fill="#8a8a8a">3 · JUDGMENT</text>
<rect x="390" y="34" width="220" height="50" rx="14" fill="#e9e9e9"/>
<text x="500" y="59.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Your brief</text>
<rect x="130" y="160" width="280" height="58" rx="14" fill="#fbe1cc"/>
<text x="270" y="189.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Claude proposes the hypotheses</text>
<rect x="590" y="160" width="280" height="58" rx="14" fill="#d4efe8"/>
<text x="730" y="189.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Codex attacks them</text>
<rect x="360" y="274" width="280" height="54" rx="14" fill="#fbf0c4"/>
<text x="500" y="301.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">You confirm the rubric</text>
<rect x="130" y="404" width="280" height="58" rx="14" fill="#fbe1cc"/>
<text x="270" y="433.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Claude argues for it</text>
<rect x="590" y="404" width="280" height="58" rx="14" fill="#d4efe8"/>
<text x="730" y="433.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Codex argues against it</text>
<rect x="360" y="558" width="280" height="58" rx="14" fill="#fbe1cc"/>
<text x="500" y="587.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Claude answers every challenge by id</text>
<rect x="150" y="712" width="700" height="72" rx="14" fill="#d4efe8"/>
<text x="500" y="735.6" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">Codex scores the rubric and rules</text>
<text x="500" y="760.4" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">supported · refuted · undecided</text>
<rect x="360" y="838" width="280" height="54" rx="14" fill="#fbf0c4"/>
<text x="500" y="865.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="600" fill="#4b4b4b">You rule when undecided</text>
<rect x="290" y="928" width="420" height="50" rx="14" fill="#e9e9e9"/>
<text x="500" y="953.0" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="#4b4b4b">hypothesis · cases · ruling · REPORT.md</text>
<line x1="500" y1="84" x2="500" y2="118" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="420" y1="189" x2="580" y2="189" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah-rev)" stroke-dasharray="7 6"/>
<line x1="500" y1="238" x2="500" y2="272" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="500" y1="328" x2="500" y2="362" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="420" y1="433" x2="580" y2="433" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah-rev)" stroke-dasharray="7 6"/>
<line x1="500" y1="482" x2="500" y2="516" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="500" y1="636" x2="500" y2="670" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="500" y1="802" x2="500" y2="836" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="500" y1="892" x2="500" y2="926" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="500" y="168" text-anchor="middle" dominant-baseline="central" font-size="15" font-style="italic" fill="#8a8a8a">rounds</text>
<text x="500" y="992" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8a8a8a">Every model box is a fresh agent — a new, independent context given only the markdown code rendered for it;</text>
<text x="500" y="1016" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8a8a8a">every review round is handed the whole trajectory by code — the record is on disk, never in a thread.</text>
<text x="500" y="1040" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8a8a8a">Slate boxes and every arrow are code: the driver sequences the run — a workflow enforced by code, not by agents.</text>
<text x="500" y="1064" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8a8a8a">An agent's only power is filling in a JSON schema, enforced at generation by constrained decoding —</text>
<text x="500" y="1088" text-anchor="middle" dominant-baseline="central" font-size="16" font-style="italic" fill="#8a8a8a">no file reads, no shell, no edits, no tools: the agent answers; code writes every file and decides every step.</text>
</svg>
